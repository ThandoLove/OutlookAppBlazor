<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>Sage X3 Secure Single Sign-On Gateway</title>

    <!-- FIX: Official Microsoft Content Delivery Network Reference Engine Initialization -->
    <script src="https://microsoft.com" type="text/javascript"></script>

    <script type="text/javascript">
        // Safe check ensures the Office library environment is fully available
        if (typeof Office !== 'undefined') {
            Office.onReady((info) => {
                const urlParams = new URLSearchParams(window.location.search);
                const code = urlParams.get('code');
                const error = urlParams.get('error');

                if (code) {
                    // Safe verification sends token objects up to the underlying Blazor Server host
                    Office.context.ui.messageParent(JSON.stringify({ status: "success", authCode: code }));
                } else if (error) {
                    Office.context.ui.messageParent(JSON.stringify({ status: "error", message: error }));
                }
            });
        }
    </script>
</head>
<body style="font-family: 'Segoe UI', -apple-system, sans-serif; text-align: center; margin-top: 60px; background-color: #f8f9fa; color: #323130;">
    <h3 style="font-size: 1.1rem; font-weight: 700;">Verifying Session Identity...</h3>
    <p style="color: #605e5c; font-size: 13px;">Processing access token authorization constraints inside Syracuse secure containers.</p>
</body>
</html>
